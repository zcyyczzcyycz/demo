<!DOCTYPE html>
<html>

<head>
  <style>
    @supports (display: grid) {
      .box {
        display: grid;
      }
    }

    @media (min-width:600px) {
      .box {
        color: red;
      }
    }

    @media (max-width:700px) {
      .box {
        color: rgb(30, 189, 48);
      }
    }

    * {
      margin: 0;
      padding: 0;
    }

    #app {
      width: 300px;
      /* 设计稿宽度 */
      height: 300px;
      /* 设计稿高度 */
      color: aliceblue;
      font-size: 16px;
      padding: 20px;
      box-sizing: border-box;
      background: #15681a;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="target" style="border:1px solid red;padding:20px;">放置区域</div>
    <button id="openBtn" draggable>打开文件</button>
  </div>
  <script>
    function setScale() {
      const app = document.getElementById('app');
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const designW = 1920;
      const designH = 1080;

      const scaleX = winW / designW;
      const scaleY = winH / designH;
      const scale = Math.max(scaleX, scaleY);

      app.style.transform = `scale(${scale})`;
      app.style.transformOrigin = 'left top';
      app.style.marginLeft = (winW - designW * scale) / 2 + 'px';
      app.style.marginTop = (winH - designH * scale) / 2 + 'px';
    }

    window.addEventListener('resize', setScale);
    window.addEventListener('load', setScale);

    // 兜底：定时检测缩放变化（Chrome缩放时resize有时不触发）
    let lastWidth = window.innerWidth;
    setInterval(() => {
      if (window.innerWidth !== lastWidth) {
        lastWidth = window.innerWidth;
        setScale();
      }
    }, 200);
  </script>
  <script>
    const openBtn = document.getElementById('openBtn');
    const shareData = {
      title: "MDN",
      text: "Learn web development on MDN!",
      url: "https://developer.mozilla.org",
    };
    openBtn.addEventListener("click", async () => {
      try {
        // 先校验是否可分享
        if (navigator.canShare && navigator.canShare(shareData)) {
          await navigator.share(shareData);
          console.log("分享弹窗已打开");
        } else {
          alert("当前浏览器不支持分享");
        }
      } catch (err) {
        console.error("分享取消或者失败", err);
      }
    });

  </script>
</body>

</html>
